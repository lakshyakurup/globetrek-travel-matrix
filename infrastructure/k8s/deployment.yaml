apiVersion: apps/v1
kind: Deployment
metadata:
  name: globetrek-backend
spec:
  replicas: 3
  selector:
    matchLabels: { app: globetrek-backend }
  template:
    metadata: { labels: { app: globetrek-backend } }
    spec:
      containers:
        - name: api
          image: ghcr.io/lakshyakurup/globetrek-backend:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: globetrek-secrets } }]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: globetrek-backend }
spec:
  selector: { app: globetrek-backend }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: globetrek-backend }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: globetrek-backend }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
