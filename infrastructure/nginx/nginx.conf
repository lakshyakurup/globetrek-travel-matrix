events {}
http {
  upstream frontend { server frontend:3000; }
  upstream backend { server backend:8000; }
  server {
    listen 80;
    server_name globetrek.example.com;
    client_max_body_size 20m;
    location /api/ { proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location / { proxy_pass http://frontend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  }
}
