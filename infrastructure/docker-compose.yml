services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: globetrek
      POSTGRES_USER: globetrek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globetrek -d globetrek"]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://globetrek:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/globetrek
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  frontend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres-data:
