name: Security scan
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions: { security-events: write, packages: read, actions: read, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      # Development-only lint tooling currently pulls an advisory with no patched
      # release. Audit the production dependency graph as the deployable surface.
      - run: npm audit --omit=dev --audit-level=high
      - uses: snyk/actions/node@master
        continue-on-error: true
        env: { SNYK_TOKEN: "${{ secrets.SNYK_TOKEN }}" }
